name: SharedSpatialAI
options:
  bundleIdPrefix: com.hackgt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
targets:
  SharedSpatialAI:
    type: application
    platform: iOS
    sources:
      - path: SharedSpatialAI
        excludes:
          - Resources/Info.plist
    settings:
      INFOPLIST_FILE: SharedSpatialAI/Resources/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.hackgt.SharedSpatialAI
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: RoomPlan.framework
      - sdk: RealityKit.framework
      - sdk: ARKit.framework
    info:
      path: SharedSpatialAI/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: Camera access is required for RoomPlan room scanning and AR overlay placement.
        NSLocalNetworkUsageDescription: Local network access lets this app sync the shared scene with the FastAPI backend on your Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
